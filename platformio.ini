; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp8266dev



[env:esp8266dev]
platform = espressif8266
board = d1_mini
framework = arduino
board_build.filesystem = littlefs
board_build.flash_mode = qio
;upload_protocol = esptool
monitor_speed = 115200
board_build.mcu = esp8266
extra_scripts = pre:scripts/pre_build.py
lib_deps =
    bblanchon/ArduinoJson@^7.0.4
    https://github.com/Brooklyn-Tactical/Arduino-HFSM.git
    https://github.com/ESP32Async/ESPAsyncWebServer.git
lib_extra_dirs = .pio/libdeps/esp8266dev/HFSM/lib


[env:esp32dev]
platform = espressif32
framework = arduino
board = esp32dev
;board_bootloader.image = "C:/Users/nbeni/.platformio/packages/framework-arduinoespressif32/tools/sdk/esp32/bin/bootloader_qio_40m.elf"
board_build.filesystem = littlefs
board_build.flash_mode = qio
;upload_protocol = esptool
board_build.partitions = app3M_spiffs9M_fact512k_16MB.csv
monitor_speed = 115200
board_build.mcu = esp32
extra_scripts = pre:scripts/pre_build.py
lib_deps =
    bblanchon/ArduinoJson@^7.0.4
    https://github.com/Brooklyn-Tactical/Arduino-HFSM.git
    https://github.com/ESP32Async/ESPAsyncWebServer.git
lib_extra_dirs = .pio/libdeps/esp32dev/HFSM/lib
