; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp8266dev



[env:esp8266dev]
;platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
platform = espressif8266
board = d1_mini
framework = arduino
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m2m.ld
board_build.flash_mode = qio
;upload_protocol = esptool
monitor_speed = 115200
;board_build.mcu = esp8266
extra_scripts = pre:scripts/pre_build.py
lib_deps =
    bblanchon/ArduinoJson@^7.0.4
    https://github.com/Brooklyn-Tactical/Arduino-HFSM.git
    ;https://github.com/ESP32Async/ESPAsyncWebServer.git
;    esp32async/AsyncTCP @ ^3.4.9
    esp32async/ESPAsyncWebServer @ ^3.8.1
    thomasfredericks/Bounce2@^2.71
    septillion-git/FadeLed@^1.6.0
    https://github.com/jasonacox/TM1637TinyDisplay.git#v1.12.1

lib_ignore = AsyncTCP
lib_extra_dirs = .pio/libdeps/esp8266dev/HFSM/lib
build_flags =
    -D CONFIG_ASYNC_TCP_MAX_ACK_TIME=5000
    -D CONFIG_ASYNC_TCP_PRIORITY=10
    -D CONFIG_ASYNC_TCP_QUEUE_SIZE=64
    -D CONFIG_ASYNC_TCP_RUNNING_CORE=1
    -D CONFIG_ASYNC_TCP_STACK_SIZE=4096
;    -D FIRMWARE_VERSION_MAJOR=2
;    -D FIRMWARE_VERSION_MINOR=0


[env:esp32dev]
platform = espressif32
framework = arduino
board = esp32dev
;board_bootloader.image = "C:/Users/nbeni/.platformio/packages/framework-arduinoespressif32/tools/sdk/esp32/bin/bootloader_qio_40m.elf"
board_build.filesystem = littlefs
board_build.flash_mode = qio
;upload_protocol = esptool
board_build.partitions = app3M_spiffs9M_fact512k_16MB.csv
monitor_speed = 115200
board_build.mcu = esp32
extra_scripts = pre:scripts/pre_build.py
lib_deps =
    bblanchon/ArduinoJson@^7.0.4
    https://github.com/Brooklyn-Tactical/Arduino-HFSM.git
    https://github.com/ESP32Async/ESPAsyncWebServer.git
    thomasfredericks/Bounce2@^2.71
    septillion-git/FadeLed@^1.6.0
    https://github.com/jasonacox/TM1637TinyDisplay.git#v1.12.1
lib_extra_dirs = .pio/libdeps/esp32dev/HFSM/lib
build_flags =
    -D FIRMWARE_VERSION_MAJOR=2
    -D FIRMWARE_VERSION_MINOR=0
